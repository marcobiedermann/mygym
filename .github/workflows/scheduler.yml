name: Frequentation Scraper

on:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Log frequentation
        run: ./scripts/log-frequentation.sh 'IEA$1'
      - name: Commit changes
        run: ./scripts/commit-if-changed.sh 'chore: add report' .
